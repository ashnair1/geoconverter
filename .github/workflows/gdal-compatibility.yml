name: GDAL Compatibility Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly to catch new GDAL releases
    - cron: '0 2 * * 1'

jobs:
  gdal-compatibility:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        gdal-version: ['3.8', '3.9', '3.10', '3.11']
        python-version: ['3.9', '3.10', '3.11']
        exclude:
          # Reduce matrix size by excluding some combinations
          - os: windows-latest
            python-version: '3.9'
          - os: macos-latest
            python-version: '3.9'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Setup Conda
      uses: conda-incubator/setup-miniconda@v2
      with:
        python-version: ${{ matrix.python-version }}
        activate-environment: ctb-test

    - name: Install GDAL and dependencies
      shell: bash -l {0}
      run: |
        conda install -c conda-forge gdal=${{ matrix.gdal-version }} cmake ninja zlib

    - name: Display environment info
      shell: bash -l {0}
      run: |
        echo "GDAL version: $(gdal-config --version)"
        echo "Python version: $(python --version)"
        echo "CMake version: $(cmake --version)"
        echo "Conda prefix: $CONDA_PREFIX"

    - name: Configure cesium-terrain-builder (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash -l {0}
      working-directory: cesium-terrain-builder
      run: |
        mkdir -p build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DGDAL_LIBRARY_DIR=$CONDA_PREFIX/lib \
          -DGDAL_LIBRARY=$CONDA_PREFIX/lib/libgdal.so \
          -DGDAL_INCLUDE_DIR=$CONDA_PREFIX/include \
          -DZLIB_LIBRARY=$CONDA_PREFIX/lib/libz.so \
          -DZLIB_INCLUDE_DIR=$CONDA_PREFIX/include

    - name: Configure cesium-terrain-builder (Windows)
      if: runner.os == 'Windows'
      shell: bash -l {0}
      working-directory: cesium-terrain-builder
      run: |
        mkdir -p build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DGDAL_LIBRARY_DIR=$CONDA_PREFIX/Library/lib \
          -DGDAL_LIBRARY=$CONDA_PREFIX/Library/lib/gdal.lib \
          -DGDAL_INCLUDE_DIR=$CONDA_PREFIX/Library/include \
          -DZLIB_LIBRARY=$CONDA_PREFIX/Library/lib/zlib.lib \
          -DZLIB_INCLUDE_DIR=$CONDA_PREFIX/Library/include

    - name: Build cesium-terrain-builder
      shell: bash -l {0}
      working-directory: cesium-terrain-builder/build
      run: |
        cmake --build . --config Release -j 2

    - name: Test cesium-terrain-builder tools
      shell: bash -l {0}
      working-directory: cesium-terrain-builder/build
      run: |
        # Test that tools can run and show version
        ./tools/ctb-tile --version || ./tools/Release/ctb-tile.exe --version
        ./tools/ctb-info --version || ./tools/Release/ctb-info.exe --version

    - name: Install geoconverter dependencies
      shell: bash -l {0}
      run: |
        pip install numpy

    - name: Test geoconverter
      shell: bash -l {0}
      run: |
        # Test that geoconverter can import and run
        python -c "from geoconverter import gdal_convert; print('Import successful')"
        python geoconverter/gdal_convert.py --help

    - name: Create test data and run integration test
      shell: bash -l {0}
      run: |
        # Create dummy test data
        python tests/data.py

        # Test basic conversion
        python geoconverter/gdal_convert.py -i tests/dummy.tif -o test_output.tif -of GTiff

        # Verify output exists
        ls -la test_output.tif

  notify-compatibility:
    runs-on: ubuntu-latest
    needs: gdal-compatibility
    if: always()
    steps:
    - name: Report compatibility status
      run: |
        echo "GDAL compatibility test results:"
        echo "Status: ${{ needs.gdal-compatibility.result }}"
        if [ "${{ needs.gdal-compatibility.result }}" != "success" ]; then
          echo "::warning::Some GDAL compatibility tests failed. Check the matrix for details."
        else
          echo "::notice::All GDAL compatibility tests passed!"
        fi
