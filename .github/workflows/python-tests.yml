name: Python Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
        exclude:
          # Reduce matrix size by excluding some combinations
          - os: windows-latest
            python-version: '3.8'
          - os: macos-latest
            python-version: '3.8'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Setup Conda for GDAL
      uses: conda-incubator/setup-miniconda@v2
      with:
        python-version: ${{ matrix.python-version }}
        activate-environment: test-env

    - name: Install GDAL and dependencies
      shell: bash -l {0}
      run: |
        conda install -c conda-forge gdal numpy pytest pytest-cov pytest-mock

    - name: Install geoconverter in development mode
      shell: bash -l {0}
      run: |
        pip install -e ".[dev]"

    - name: Lint with ruff
      shell: bash -l {0}
      run: |
        ruff check geoconverter tests scripts
        ruff format --check geoconverter tests scripts

    - name: Type check with mypy
      shell: bash -l {0}
      run: |
        mypy geoconverter
      continue-on-error: true  # Don't fail on type errors yet

    - name: Test with pytest
      shell: bash -l {0}
      run: |
        pytest -v --cov=geoconverter --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  code-quality:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pre-commit

    - name: Run pre-commit
      run: |
        pre-commit run --all-files

  integration-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Setup Conda
      uses: conda-incubator/setup-miniconda@v2
      with:
        python-version: '3.11'
        activate-environment: integration-test

    - name: Install dependencies
      shell: bash -l {0}
      run: |
        # Install GDAL and build tools
        conda install -c conda-forge gdal numpy cmake ninja zlib

        # Install Python package
        pip install -e ".[dev]"

    - name: Build cesium-terrain-builder
      shell: bash -l {0}
      run: |
        cd cesium-terrain-builder
        mkdir -p build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DGDAL_LIBRARY_DIR=$CONDA_PREFIX/lib \
          -DGDAL_LIBRARY=$CONDA_PREFIX/lib/libgdal.so \
          -DGDAL_INCLUDE_DIR=$CONDA_PREFIX/include \
          -DZLIB_LIBRARY=$CONDA_PREFIX/lib/libz.so \
          -DZLIB_INCLUDE_DIR=$CONDA_PREFIX/include
        cmake --build . --config Release -j2

    - name: Run integration tests
      shell: bash -l {0}
      run: |
        # Test Python components
        pytest tests/ -v -m integration

        # Test CLI
        geoconverter --help

        # Test conversion workflow
        python tests/data.py  # Create test data
        geoconverter -i tests/dummy.tif -o test_output.tif -of GTiff

        # Verify output
        ls -la test_output.tif

    - name: Test GDAL monitoring script
      shell: bash -l {0}
      run: |
        python scripts/monitor_gdal.py
